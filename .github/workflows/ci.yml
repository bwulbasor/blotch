name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with crypto + docs extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[crypto,docs]" pytest
      - name: Run tests
        run: pytest -q
      - name: Leak benchmark (fails the build on any leak)
        run: python -m blotch.cli benchmark --policy maximum --no-spacy
      - name: Synthetic evaluation (fails on any leaked gold span)
        run: python -m evaluation.evaluate

  spacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the NER extra + English model
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[crypto,docs,ner]" pytest
          python -m spacy download en_core_web_sm
      - name: Run tests (exercises the real spaCy union path)
        run: pytest -q

  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the OCR extra + a pip-only engine (RapidOCR)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,ocr]" pytest rapidocr-onnxruntime
      - name: Run OCR tests (renders real image-only PDFs and reads them back)
        run: pytest -q tests/test_ocr.py
