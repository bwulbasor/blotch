[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "censorbot"
version = "0.1.0"
description = "A local privacy gateway: reversible pseudonymisation between your sensitive documents and external AI/services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "censorbot contributors" }]
keywords = ["privacy", "pii", "pseudonymisation", "redaction", "llm", "gdpr", "phi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]
ner = ["spacy>=3.7"]
docs = ["pypdf>=4", "python-docx>=1.1", "reportlab>=4"]
all = ["cryptography>=42", "spacy>=3.7", "pypdf>=4", "python-docx>=1.1", "reportlab>=4"]
dev = ["pytest>=8", "cryptography>=42"]

[project.scripts]
censorbot = "censorbot.cli:main"

[project.urls]
Repository = "https://github.com/bwulbasor/censorbot"

[tool.hatch.build.targets.wheel]
packages = ["src/censorbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
