[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blotch"
version = "0.1.0"
description = "A local privacy gateway: reversible pseudonymisation between your sensitive documents and external AI/services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "blotch contributors" }]
keywords = ["privacy", "pii", "pseudonymisation", "redaction", "llm", "gdpr", "phi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]
ner = ["spacy>=3.7"]
docs = ["pypdf>=4", "python-docx>=1.1", "reportlab>=4"]
# OCR fallback for scanned / image-only PDFs. PyMuPDF renders pages; the
# recognition engine is either the system Tesseract (via pytesseract) or the
# pip-only rapidocr-onnxruntime - install one. Pillow decodes the rendered pages.
ocr = ["pymupdf>=1.24", "pillow>=10", "pytesseract>=0.3.10"]
all = ["cryptography>=42", "spacy>=3.7", "pypdf>=4", "python-docx>=1.1",
       "reportlab>=4", "pymupdf>=1.24", "pillow>=10", "pytesseract>=0.3.10"]
dev = ["pytest>=8", "cryptography>=42"]

[project.scripts]
blotch = "blotch.cli:main"

[project.urls]
Repository = "https://github.com/bwulbasor/blotch"

[tool.hatch.build.targets.wheel]
packages = ["src/blotch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
